name: Deploy to shop.mylook.com.de

# Deploys the myfeeds-affiliate-feed-manager plugin folder to the test
# site shop.mylook.com.de after every push to main. A manual run is also
# exposed via workflow_dispatch so you can redeploy without a new commit.
#
# Where it deploys to is ONE repository variable, DEPLOY_TARGET:
# siteground (also when unset - what this workflow did before netcup
# existed) or netcup. A manual run can pick a target for itself. Both sets
# of settings live side by side, so switching back is that one variable
# again. This repository is public and so are its run logs: nothing below
# prints a host, a user or a path.
#
# SiteGround - repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          e.g. ssh.mylook.com.de
#   SSH_USER          your SiteGround SSH username (Site Tools → SSH Keys Manager)
#   SSH_PORT          usually 18765 for SiteGround; defaults to 22 if unset
#   SSH_PRIVATE_KEY   the private half of the SSH key whose public half is
#                     added in Site Tools → SSH Keys Manager
#   SSH_PASSPHRASE    the passphrase you set when generating the key in
#                     SiteGround; leave unset if the key has no passphrase
#   WP_PLUGINS_DIR    absolute path to wp-content/plugins on the server,
#                     e.g. /home/customer/www/shop.mylook.com.de/public_html/wp-content/plugins
#
# netcup - one secret, the rest are repository variables (not secret):
#   NETCUP_SSH_PRIVATE_KEY      secret: the private half of the deploy key, no passphrase
#   NETCUP_SSH_HOST             the server
#   NETCUP_SSH_PORT             22 (the default when unset)
#   NETCUP_KNOWN_HOSTS          the host key line(s), required - no keyscan
#   NETCUP_SSH_USER_STAGING     the site user of shop.mylook.com.de (CloudPanel: one user per site)
#   NETCUP_PLUGINS_DIR_STAGING  its wp-content/plugins, inside that user's home

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to: auto follows the repository variable DEPLOY_TARGET'
        type: choice
        options: [auto, siteground, netcup]
        default: auto

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync plugin folder
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pick the deploy target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          VAR_TARGET: ${{ vars.DEPLOY_TARGET }}
          SG_SSH_HOST: ${{ secrets.SSH_HOST }}
          SG_SSH_PORT: ${{ secrets.SSH_PORT }}
          SG_SSH_USER: ${{ secrets.SSH_USER }}
          SG_PLUGINS_DIR: ${{ secrets.WP_PLUGINS_DIR }}
          SG_KEY_SET: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          NETCUP_SSH_HOST: ${{ vars.NETCUP_SSH_HOST }}
          NETCUP_SSH_PORT: ${{ vars.NETCUP_SSH_PORT }}
          NETCUP_KNOWN_HOSTS: ${{ vars.NETCUP_KNOWN_HOSTS }}
          NETCUP_SSH_USER_STAGING: ${{ vars.NETCUP_SSH_USER_STAGING }}
          NETCUP_PLUGINS_DIR_STAGING: ${{ vars.NETCUP_PLUGINS_DIR_STAGING }}
          NETCUP_KEY_SET: ${{ secrets.NETCUP_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          case "${INPUT_TARGET:-auto}" in
            ''|auto) TARGET="${VAR_TARGET:-siteground}" ;;
            *)       TARGET="$INPUT_TARGET" ;;
          esac

          missing=""
          case "$TARGET" in
            siteground)
              [ -n "${SG_SSH_HOST:-}" ]    || missing="$missing secret:SSH_HOST"
              [ -n "${SG_SSH_USER:-}" ]    || missing="$missing secret:SSH_USER"
              [ -n "${SG_PLUGINS_DIR:-}" ] || missing="$missing secret:WP_PLUGINS_DIR"
              [ "${SG_KEY_SET:-}" = "true" ] || missing="$missing secret:SSH_PRIVATE_KEY"
              HOST="${SG_SSH_HOST:-}"; PORT="${SG_SSH_PORT:-}"; USER_NAME="${SG_SSH_USER:-}"
              DIR="${SG_PLUGINS_DIR:-}"; KNOWN=""
              ;;
            netcup)
              [ -n "${NETCUP_SSH_HOST:-}" ]            || missing="$missing variable:NETCUP_SSH_HOST"
              [ -n "${NETCUP_KNOWN_HOSTS:-}" ]         || missing="$missing variable:NETCUP_KNOWN_HOSTS"
              [ -n "${NETCUP_SSH_USER_STAGING:-}" ]    || missing="$missing variable:NETCUP_SSH_USER_STAGING"
              [ -n "${NETCUP_PLUGINS_DIR_STAGING:-}" ] || missing="$missing variable:NETCUP_PLUGINS_DIR_STAGING"
              [ "${NETCUP_KEY_SET:-}" = "true" ]       || missing="$missing secret:NETCUP_SSH_PRIVATE_KEY"
              HOST="${NETCUP_SSH_HOST:-}"; PORT="${NETCUP_SSH_PORT:-}"; USER_NAME="${NETCUP_SSH_USER_STAGING:-}"
              DIR="${NETCUP_PLUGINS_DIR_STAGING:-}"; KNOWN="${NETCUP_KNOWN_HOSTS:-}"
              ;;
            *)
              echo "::error::Unknown deploy target '$TARGET' - DEPLOY_TARGET is siteground or netcup."
              exit 1
              ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error::Deploy target $TARGET is missing:$missing. Nothing was touched."
            exit 1
          fi

          # Before anything can rsync --delete into it. On netcup the folder
          # has to lie in its user's home: a user and a folder from two
          # different sites would put one site's files into the other.
          case "$DIR" in
            /home/*/wp-content/plugins|/home/*/wp-content/plugins/) ;;
            *) echo "::error::The plugins folder for $TARGET does not look like /home/.../wp-content/plugins. Nothing was touched."; exit 1 ;;
          esac
          if [ "$TARGET" = "netcup" ]; then
            case "$DIR" in
              "/home/$USER_NAME/"*) ;;
              *) echo "::error::The plugins folder for netcup is not in the home of its ssh user. Nothing was touched."; exit 1 ;;
            esac
          fi

          delim="MF_KNOWN_HOSTS_$$_${RANDOM}${RANDOM}"
          {
            echo "DEPLOY_TARGET=$TARGET"
            echo "SSH_HOST=$HOST"
            echo "SSH_PORT=${PORT:-22}"
            echo "SSH_USER=$USER_NAME"
            echo "WP_PLUGINS_DIR=${DIR%/}"
            if [ -n "$KNOWN" ]; then
              echo "SSH_KNOWN_HOSTS<<$delim"
              printf '%s\n' "$KNOWN"
              echo "$delim"
            else
              echo "SSH_KNOWN_HOSTS="
            fi
          } >> "$GITHUB_ENV"
          echo "deploy target: $TARGET"

      - name: Load SSH deploy key
        env:
          SG_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SG_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          NETCUP_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ "$DEPLOY_TARGET" = "netcup" ]; then
            ( umask 077 && printf '%s\n' "$NETCUP_PRIVATE_KEY" > ~/.ssh/id_deploy )
          else
            ( umask 077 && printf '%s\n' "$SG_PRIVATE_KEY" > ~/.ssh/id_deploy )
          fi
          chmod 600 ~/.ssh/id_deploy

          # If a passphrase was supplied, strip it in place so ssh-add / rsync
          # can use the key non-interactively. The unencrypted key only lives
          # in the runner's ephemeral filesystem for the duration of the job.
          # Only SiteGround's keys carry one.
          if [ "$DEPLOY_TARGET" != "netcup" ] && [ -n "${SG_PASSPHRASE:-}" ]; then
            ssh-keygen -p -f ~/.ssh/id_deploy -P "$SG_PASSPHRASE" -N "" >/dev/null
          fi

          # netcup's host key is pinned; a keyscan would trust whatever
          # answers first. SiteGround keeps the keyscan it always had.
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "host key: pinned"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: rsync plugin to shop.mylook.com.de
        run: |
          set -euo pipefail
          TARGET="${WP_PLUGINS_DIR%/}/myfeeds-affiliate-feed-manager/"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='tests/' \
            --exclude='.vibe-context/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            ./myfeeds-affiliate-feed-manager/ \
            "${SSH_USER}@${SSH_HOST}:${TARGET}"

      - name: Clear deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
